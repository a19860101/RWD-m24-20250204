<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        section {
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
            h1 {
                width: 100%;
                text-align: center;
                opacity: 0;
                font-size: 10rem;
                animation: fade-in  forwards;
                animation-timeline: view(200px);
                letter-spacing: 100px;
            }
        }
        @keyframes fade-in {
            to {
                opacity: 1;
                letter-spacing: 0;
            }
        }
        section:nth-of-type(1){background-color: #ff77c6;}
        section:nth-of-type(2){background-color: #dfff6b;}
        section:nth-of-type(3){background-color: #63fff7;}
        section:nth-of-type(4){background-color: #e065ff;}
    </style>
</head>
<body>
    <section>
        <h1>Section 1</h1>
    </section>
    <section>
        <h1>Section 2</h1>
    </section>
    <section>
        <h1>Section 3</h1>
    </section>
    <section>
        <h1>Section 4</h1>
    </section>
</body>
</html>
