<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 運算子 operator
        // 數學
        let x = 10;
        let y = 6;

        console.log(x + y);
        console.log(x - y);
        console.log(x * y);
        console.log(x / y);
        console.log(x % y); //求餘數

        // 比較運算子
        console.log(x == y);
        console.log(x > y);
        console.log(x < y);
        console.log(x >= y);
        console.log(x <= y);
        console.log(x != y);

        // 指定運算子(賦值運算值)
        console.log(x = y);
        console.log(x += y); // x = x + y
        console.log(x -= y); // x = x - y
        console.log(x *= y); // x = x * y
        console.log(x /= y); // x = x / y
        console.log(x %= y); // x = x % y

        // 邏輯運算子  && and, || or, ! not
        console.log(x > 0 && y > 0);
        console.log(x > 0 || y > 0);
        console.log(!x);
        console.log(!y);

        // let a = null;
        // let a = 0;
        // let a;
        // let a = '';
        let a = -1;
        console.log(!a)

        // 遞增遞減運算子
        let q = 10;
        // console.log(++q);
        // console.log(q++);
        // console.log(--q);
        console.log(q--);

        console.log(q);

    </script>
</body>
</html>
