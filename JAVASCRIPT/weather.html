<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Staatliches&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Staatliches';
            /* display: grid;
            place-content: center;
            height: 100vh; */
        }
        .weather-box {
            position: fixed;
            inset:0;
            margin: auto;
            display: grid;
            background-color: #ccc;
            grid-template-columns: repeat(2,1fr);
            width: 200px;
            height: fit-content;
            place-items: center;
            border-radius: 10px;
            padding: 15px;
        }
        .temp {
            grid-column: span 2;
            font-size: 3rem;
            font-weight: bold;
        }
        .icon {
            grid-column: span 2;
        }
        .temp-max {
            color: #ff637d;
            padding: 10px;
        }
        .temp-min {
            color: #4babd1;
            padding: 10px;
        }
        .desc {
            padding: 10px;
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="weather-box">
        <div class="temp"></div>
        <div class="icon">
        </div>
        <div class="temp-min"></div>
        <div class="temp-max"></div>
        <div class="desc"></div>
    </div>
    <script>
        let url = 'https://api.openweathermap.org/data/2.5/weather?q=bangkok&lang=zh_TW&units=metric&appid=b1ecbccd638b763d489602917ba47cc3'
    
        fetch(url)
        .then(res=>res.json())
        .then(data => {
            //  https://openweathermap.org/img/wn/10d@2x.png
            console.log(data)
            document.querySelector('.temp').innerHTML = `${data.main.temp}&deg;C`
            document.querySelector('.temp-max').innerHTML = data.main.temp_max
            document.querySelector('.temp-min').innerHTML = data.main.temp_min
            document.querySelector('.icon').innerHTML = `<img src=" https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png">`
            // document.querySelector('.temp').append(data.main.temp)
            document.querySelector('.desc').textContent = data.weather[0].description
        })
    </script>

</body>
</html>
