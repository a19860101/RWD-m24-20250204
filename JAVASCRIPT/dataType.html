<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 資料型別 data type

        // 數值 Number
        let n = 123;

        // 字串 String
        let s = 'hello';

        // 布林 Boolean
        let b = false;

        // 空值 Null(Object)
        let x = null;

        // 未定義 Undefined
        // let q;
        let q = undefined;

        // 陣列 Array(Object)
        let a = [1,2,3,4];

        // 物件 Object
        let o = {
            name:'John',
            mail: 'asdf@gmail.com'
        }

        // 函式 Function
        function foo(){return 'hello'}

        // 集合 Set(Object)
        let S = new Set([1,2,3])

        console.log(typeof(S));
        console.log(S)
    </script>
</body>
</html>
