<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .colors {
            display: flex;
            gap: 10px;
        }
        .colorBox {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>{{title}} - {{current.color}}</h2>
        <div>
            庫存:{{current.qty}}
        </div>
        <div>
            <div v-if="current.qty > 10">熱賣中</div>
            <div v-else-if="current.qty > 0">低庫存</div>
            <div v-else>補貨中</div>
        </div>
        <div>
            <img :src="`images/${current.image}`" alt="" width="600">
        </div>
        <div class="colors">
            <div v-for="p,idx in products" @click="changeColor(idx)" class="colorBox" :style="{backgroundColor:p.colorCode}"></div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    title: 'iPhone 16',
                    currentIndex: 0,
                    products: [
                        {
                            image:'iphone-16-finish-select-202409-6-1inch-black.webp',
                            color: '黑色',
                            colorCode: 'black',
                            qty: 10,
                        },
                        {
                            image:'iphone-16-finish-select-202409-6-1inch-white.webp',
                            color: '白色',
                            colorCode: '#eee',
                            qty: 25,
                        },
                        {
                            image:'iphone-16-finish-select-202409-6-1inch-pink.webp',
                            color: '粉紅色',
                            colorCode: 'pink',
                            qty: 7,
                        },
                        {
                            image:'iphone-16-finish-select-202409-6-1inch-teal.webp',
                            color: '湖水綠',
                            colorCode: 'teal',
                            qty: 3,
                        },
                        {
                            image:'iphone-16-finish-select-202409-6-1inch-ultramarine.webp',
                            color: '湛海藍',
                            colorCode: '#00f',
                            qty: 23,
                        },
                    ]
                }
            },
            methods:{
                changeColor(idx){
                    this.currentIndex =  idx
                }
            },
            computed:{
                current(){
                    return this.products[this.currentIndex]
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
