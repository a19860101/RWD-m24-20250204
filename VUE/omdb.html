<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 600px;
            margin:auto;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2,1fr);
            .poster {
                aspect-ratio: 4 / 6;
                img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <form action="" method="post" @submit.prevent="getMovie()">
            <input type="text" v-model="s">
            <input type="submit" value="Search">
        </form>
        <div class="container">
            <div v-for="movie in movies" class="movie">
                <div class="poster">
                    <img :src="movie.Poster" alt="">
                </div>
                <div class="title">
                    {{movie.Title}} / {{movie.Year}}
                </div>
                <div class="imdb">
                    IMDB: {{movie.imdbID}}
                </div>
            </div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {
                    movies:[],
                    s: 'spider',
                    apikey: '18456e59',
                }
            },
            methods:{
                getMovie(){
                    let url = `http://www.omdbapi.com/?apikey=${this.apikey}&s=${this.s}`

                    fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        this.movies = data.Search
                    })
                }
            },
            
        }).mount('#app')
    </script>
</body>
</html>
