<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 600px;
            margin:auto;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2,1fr);
            .poster {
                aspect-ratio: 4 / 6;
                img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <form action="" method="post" @submit.prevent="getMovie()">
            <input type="text" v-model="s">
            <input type="submit" value="Search">
        </form>
        <div>
            <div>
                <a href="#" v-for="p in totalPages" @click="getMovie(p)">{{p}}</a>
            </div>
            <a href="#" @click="getMovie(1)" v-if="total">第一頁</a>
            <a href="#" @click="prevPage()" v-if="currentPage != 1">上一頁</a>
            <a href="#" @click="nextPage()" v-if="currentPage < totalPages">下一頁</a>
            <a href="#" @click="getMovie(totalPages)"v-if="total">最末頁</a>
        </div>
        <div v-if="total > 0">共有{{total}}筆資料 {{totalPages}}頁</div>
        <div class="container">
            <div v-for="movie in movies" class="movie">
                <div class="poster">
                    <img v-if="movie.Poster != 'N/A' " :src="movie.Poster" alt="">
                    <img v-else src="https://placehold.co/400x600?text=N/A" alt="">
                </div>
                <div class="title">
                    {{movie.Title}} / {{movie.Year}}
                </div>
                <div class="imdb">
                    IMDB: {{movie.imdbID}}
                </div>
            </div>
        </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return {                                                                                                            
                    movies:[],
                    s: 'spider',
                    apikey: '18456e59',
                    currentPage: 1,
                    total:0
                }
            },
            methods:{
                getMovie(p){
                    this.currentPage = p ? p : 1;
                    let url = this.apiURL;
                    fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        this.movies = data.Search
                        this.total = data.totalResults
                    })
                },
                nextPage(){
                    this.currentPage += 1;
                    let url = this.apiURL
                    // let url = `${this.apiURL}&page=${this.currentPage}`
                    fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        this.movies = data.Search
                        console.log(this.movies)
                    })
                },
                prevPage(){
                    this.currentPage -= 1;
                    let url = this.apiURL
                    // let url = `${this.apiURL}&page=${this.currentPage}`
                    fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        this.movies = data.Search
                        console.log(this.movies)
                    })
                }
            },
            computed:{
                apiURL(){
                    return `http://www.omdbapi.com/?apikey=${this.apikey}&s=${this.s}&page=${this.currentPage}`
                },
                totalPages(){
                    return Math.ceil(this.total / 10)
                }
            }
            
        }).mount('#app')
    </script>
</body>
</html>
