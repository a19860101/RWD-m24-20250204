<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="phone">電話</label>
        <input type="text" id="phone" name="phone">
        <br>
        <label for="mail">Email</label>
        <input type="email" id="mail" name="mail">
        <br>
        <label for="birth">生日</label>
        <input type="date" id="birth" name="birth">
        <br>
        <label for="qty">數量</label>
        <input type="number" id="qty" name="qty" max="10" min="2">
        <br>
        <label>性別</label>
        <input type="radio" id="male" name="gender" value="男">
        <label for="male">男</label>
        <input type="radio" id="female" name="gender" value="女">
        <label for="female">女</label>
        <input type="radio" id="unknown" name="gender" value="未知">
        <label for="unknown">未知</label>

        <br>
        <label>專長</label>

        <input type="checkbox" id="design" name="skill[]" value="平面設計">
        <label for="design">平面設計</label>
        <input type="checkbox" id="web" name="skill[]" value="網頁設計">
        <label for="web">網頁設計</label>
        <input type="checkbox" id="video" name="skill[]" value="影片剪輯">
        <label for="video">影片剪輯</label>
        <br>
        <label for="edu">學歷</label>
        <select name="edu" id="edu">
            <option>--請選擇--</option>
            <option value="國小">國小</option>
            <option value="國中">國中</option>
            <option value="高中職">高中職</option>
            <option value="大專院校">大專院校</option>
        </select>
        <br>
        <label for="content">內容</label>
        <textarea name="content" id="content" rows="10" cols="60"></textarea>
        <br>
        <input type="submit" value="送出">
        <input type="reset" value="清空">
        <input type="button" value="自訂">
        <br>
        <button type="submit">送出</button>
        <button type="reset">重設</button>
        <button type="button">自訂</button>
    </form>
</body>
</html>
