<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 3000px;
            background-image: linear-gradient(#a9d5ff,#eb7e7e);
        }
        [class|="box"]{
            width: 100px;
            height: 100px;
        }
        .box {
            background-color: #fa0;
            position: relative;
            top:20px;
            /* bottom:100px; */
            left: 20px;
            /* right:100px; */

            z-index: 99;
        }
        .box-2 {
            background-color: #098;
            position: relative;
            bottom: 20px;
            right:20px;
            z-index: 100;
        }
        .box-3 {
            background-color: #e75555;
            position: absolute;
            top: 0;
            right: 0;
            z-index: 20;
        }
        .box-4 {
            background-color: #55e7af;
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 29;
        }
        .container {
            width: 800px;
            height: 400px;
            background-color: #757575;
            position: relative;
        }
        .box-5 {
            background-color: #ffee02;
            position: fixed;
            right: 30px;
            top: 30px;
            z-index: 9999;
        }
        .box-6 {
            background-color: #ff7402;
            position: sticky;
            top: 100px;
        }
    </style>
</head>
<body>
    <!-- 
        定位position
        static 靜態
        relative 相對
        absolute 絕對
        fixed 固定
        sticky 黏性
    -->
    <div class="box"></div>
    <div class="box-2"></div>
    <div class="container">
        <div class="box-3"></div>
        <div class="box-4"></div>
    </div>
    <div class="box-5"></div>
    <div class="box-6"></div>
</body>
</html>
