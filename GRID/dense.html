<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: min(1200px,100%);
            margin-inline: auto;
            display: grid;
            grid: auto-flow 200px / repeat(auto-fill,minmax(280px, 1fr));
            gap: 5px;
            grid-auto-flow: dense;
        }
        .grid {
            background-color: #fa0;
            border-radius: 60px 0;
        }
        .grid:nth-of-type(2n){
            background-color: #098;
            grid-column: span 2;
        }
        .grid:nth-of-type(3n){
            background-color: #700470;
            grid-row: span 3;
        }
        .grid:nth-of-type(5n){
            background-color: pink;
            grid-row: span 2;
            grid-column: span 2;
            /* border-radius: 50px 0 ; */
        }
        .grid:nth-of-type(7n){
            background-color: #ff3154;
            grid-row: span 2;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
        <div class="grid"></div>
    </div>
</body>
</html>
