<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        img {
                width: 100%;   
                height: 100%;
                object-fit: cover;
            }
        header {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            place-items: center;
            background-color: #fa0;
            
            .cover {
                grid-column: 1 / -1;
                grid-row: 1 / -1;
            }
            .caption {
                grid-column: 1 / -1;
                grid-row: 1 / -1;
                .body {
                    
                    background-color: #ffffff7a;
                    padding: 20px;
                    border-radius: 12px;
                    backdrop-filter: blur(8px);
                    width: 60%;
                    margin-inline: auto;
                }
            }
        }
        
    </style>
</head>
<body>
    <header>
        <img src="https://picsum.photos/id/34/1600/900" class="cover" alt="">
        <div class="caption">
            <div class="body">
                <h1>title</h1>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque officia voluptatibus, alias assumenda accusamus iusto!
                </p>
            </div>
        </div>
    </header>
</body>
</html>
