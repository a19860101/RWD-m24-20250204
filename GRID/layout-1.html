<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        section {
            background-color: #640D5F;
            height: 100vh;
            display: grid;
            place-content: center;
        }
        .container {
            width: 800px;
            height: 800px;
            margin-inline: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
        }

        .grid {
            background-color: #FFB200;
            border-radius: 12px;
            overflow: hidden;

        }

        .grid-1 {
            grid-row: span 2;
            background-color: #098;
        }

        .grid-2 {
            grid-column: span 2;
            background-color: #D91656;
        }

        .grid-5 {
            grid-column: span 2;
            background-color: #640D5F;
        }
    </style>
</head>

<body>
    <section>     
        <div class="container">
            <div class="grid grid-1">
                <img src="https://picsum.photos/id/87/800" alt="">
            </div>
            <div class="grid grid-2">
                <img src="https://picsum.photos/id/17/800" alt="">
            </div>
            <div class="grid grid-3">
                <img src="https://picsum.photos/id/27/800" alt="">
            </div>
            <div class="grid grid-4">
                <img src="https://picsum.photos/id/37/800" alt="">
            </div>
            <div class="grid grid-5">
                <img src="https://picsum.photos/id/47/800" alt="">
            </div>
            <div class="grid grid-6">
                <img src="https://picsum.photos/id/57/800" alt="">
            </div>
        </div>
    </section>

</body>

</html>
